name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK for phone and Android TV / Mi Box
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          set -euo pipefail

          # Son kullanici APK'si bos/gecersiz bir sunucu adresiyle uretilmesin.
          # SERVER_URL tanimli degilse mevcut canli web uygulamasi kullanilir.
          if [ -z "${SERVER_URL:-}" ]; then
            SERVER_URL="https://remix-untitled-9007.ai.studio/"
          fi

          case "$SERVER_URL" in
            https://*) ;;
            *) echo "HATA: SERVER_URL https:// ile baslamali"; exit 1 ;;
          esac

          echo "Uygulama adresi: $SERVER_URL"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          JAR="$PLAT/android.jar"
          OUT=build
          rm -rf "$OUT" && mkdir -p "$OUT/classes" "$OUT/dex"

          sed "s#__SERVER_URL__#$SERVER_URL#g" android/src/com/radyokutu/tv/MainActivity.java > "$OUT/MainActivity.java"
          javac --release 8 -nowarn -cp "$JAR" -d "$OUT/classes" "$OUT/MainActivity.java"

          "$BT/d8" --min-api 21 --lib "$JAR" --output "$OUT/dex" $(find "$OUT/classes" -name '*.class')

          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$JAR" --manifest android/AndroidManifest.xml
          (cd "$OUT/dex" && zip -q "../unsigned.apk" classes.dex)

          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass radyokutu -keypass radyokutu \
            -alias radyokutu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cengiz TV Radyo" >/dev/null 2>&1

          "$BT/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:radyokutu \
            --ks-key-alias radyokutu --key-pass pass:radyokutu --out "$OUT/CengizTV-Radyo.apk" "$OUT/unsigned.apk"

          "$BT/apksigner" verify "$OUT/CengizTV-Radyo.apk"
          echo "APK hazir: $OUT/CengizTV-Radyo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CengizTV-Radyo-APK
          path: build/CengizTV-Radyo.apk

      - name: Keep only the latest two APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listArtifactsForRepo({ owner, repo, per_page: 100 });
            const apks = response.data.artifacts
              .filter((artifact) => artifact.name === 'CengizTV-Radyo-APK' && !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of apks.slice(2)) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted old APK artifact ${artifact.id} (${artifact.created_at})`);
            }
            core.info(`Kept ${Math.min(apks.length, 2)} newest APK artifact(s).`);
